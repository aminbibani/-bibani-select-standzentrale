<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111113"><title>Bibani Select Standzentrale</title><style>
*{box-sizing:border-box}body{margin:0;background:#101113;color:#f5f0e7;font:15px system-ui,-apple-system,sans-serif}header{padding:18px;background:#1b1b1d;border-bottom:1px solid #594b31;display:flex;justify-content:space-between;align-items:center}header strong{color:#e4bf73;letter-spacing:2px;font-size:19px}main{max-width:960px;margin:auto;padding:16px 14px 80px}.card{background:#1d1e21;border:1px solid #3a3730;border-radius:15px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid>.card{margin:0}.line{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.muted,small{color:#aaa}.gold{color:#e5bd6f}h1{font-size:24px}h2{font-size:20px}h3{font-size:17px}button{border:1px solid #6b5938;background:#302a22;color:#f8e5bb;padding:11px 13px;border-radius:10px;font-weight:600;cursor:pointer}button.primary{background:#d7b26d;color:#18120b}button.danger{color:#ffb8b8;border-color:#945151}button:disabled{opacity:.45}input,select,textarea{background:#101113;border:1px solid #625b4e;color:#fff;border-radius:9px;padding:11px;width:100%;font:inherit}label{display:block;margin:10px 0 5px;color:#dfcfaf;font-size:13px}nav{display:flex;gap:7px;overflow:auto;padding:10px;background:#191a1c;position:sticky;top:0;z-index:2}nav button{white-space:nowrap}nav button.active{background:#d7b26d;color:#17130e}.item{padding:12px 0;border-bottom:1px solid #373737}.item:last-child{border:0}.metric{font-size:25px;font-weight:750;color:#e4bf73}.note{background:#2c281f;border-left:3px solid #cfa95f;padding:12px;border-radius:4px}dialog{background:#222327;color:#fff;border:1px solid #9b7b45;border-radius:16px;width:min(94vw,520px);max-height:85vh;overflow:auto}dialog::backdrop{background:#000b}.hide{display:none!important}@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}
@media print{body{background:white!important;color:black!important;font:11px Arial,sans-serif!important}body>*:not(#print-area){display:none!important}#print-area{display:block!important;color:black!important}#print-area table{border-collapse:collapse;width:100%;font-size:10px}#print-area td,#print-area th{border:1px solid #aaa;padding:5px;text-align:left}#print-area h1,#print-area h2{color:black!important}.no-print{display:none!important}}#print-area{display:none}</style><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="bibani-update.css"></head><body><header><div style="display:flex;align-items:center;gap:12px"><img src="logo.png" alt="Bibani Select" style="width:54px;height:54px;object-fit:contain;border-radius:12px"><div><strong style="display:block;color:#e4bf73;letter-spacing:1px;font-size:17px">BIBANI SELECT</strong><div class="muted" style="font-size:12px">Standzentrale</div></div></div><button id="logout" class="hide" onclick="logout()">Abmelden</button></header><div id="login"><main><div class="card" style="max-width:460px;margin:40px auto"><h1>Privater Login</h1><p class="muted">Melde dich mit dem Benutzer an, den du unter Supabase → Authentication → Users erstellt hast.</p><form id="loginform"><label>E-Mail</label><input id="email" type="email" autocomplete="username" required><label>Passwort</label><input id="password" type="password" autocomplete="current-password" required><p><button class="primary" type="submit">Anmelden</button></p></form><p id="loginmsg" class="muted"></p><p class="muted" style="font-size:12px">Nur bestehende Benutzer können sich anmelden. Es gibt keine öffentliche Registrierung.</p></div></main></div><div id="private" class="hide"><nav id="tabs"></nav><main id="content"></main></div><dialog id="dialog"><div id="modal"></div><p><button onclick="document.getElementById('dialog').close()">Schließen</button></p></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
'use strict';
const PROJECT='https://jdvadltxoqbldsrvrpjq.supabase.co';
const PUBLISHABLE='sb_publishable_lx5Snif1re1Z3tz_6rZCbg__B5D4d7n';
const sb=window.supabase?.createClient(PROJECT,PUBLISHABLE,{auth:{persistSession:true,autoRefreshToken:true}});
let selectedChannel="Flohmarkt",selectedPlatform="eBay",selectedMarket="",selectedOrder="",selectedDate=new Date().toLocaleDateString("en-CA"),selectedPayment="Bar";let expenses=[],user=null,tab='dashboard',products=[],markets=[],sales=[],items=[],tasks=[],cart=[],busy=false;
const el=id=>document.getElementById(id),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),eur=n=>(Number(n)||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'}),dt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('de-DE'):'',n=v=>Number(v)||0;
function msg(t){alert(t)}function modal(s){el('modal').innerHTML=s;el('dialog').showModal()}
async function query(table,method='select',data=null,filter=null){let q=sb.from(table);if(method==='select'){q=q.select('*');if(filter)q=q.eq(filter[0],filter[1])}else if(method==='insert')q=q.insert(data).select('*');else if(method==='update')q=q.update(data).eq('id',filter).select('*');else if(method==='delete')q=q.delete().eq('id',filter);const {data:result,error}=await q;if(error)throw Error(error.message);return result||[]}
async function refresh(){try{[products,markets,sales,items,tasks]=await Promise.all(['bs_products','bs_markets','bs_sales','bs_sale_items','bs_tasks'].map(t=>query(t)));try{expenses=await query('bs_expenses')}catch(e){expenses=[];console.warn('Ausgabentabelle noch nicht eingerichtet',e.message)}render()}catch(err){msg('Datenbankfehler: '+err.message)}}
function render(){if(!user)return;let nav=[['dashboard','Übersicht'],['pos','Schnellkasse'],['products','Warenlager'],['markets','Märkte'],['reports','Abrechnung'],['tasks','Aufgaben'],['expenses','Ausgaben'],['tax','Steuerexport']];el('tabs').innerHTML=nav.map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="tab='${k}';render()">${v}</button>`).join('');el('content').innerHTML=({dashboard, pos,productView,marketView,reports,taskView,expenseView,taxView})[{dashboard:'dashboard',pos:'pos',products:'productView',markets:'marketView',reports:'reports',tasks:'taskView',expenses:'expenseView',tax:'taxView'}[tab]]()}
const sumMarket=m=>sales.filter(s=>s.market_id===m.id&&!s.voided).reduce((a,s)=>a+n(s.total),0),costMarket=m=>sales.filter(s=>s.market_id===m.id&&!s.voided).reduce((a,s)=>a+n(s.cost_total),0),profit=m=>sumMarket(m)-costMarket(m)-n(m.stand_fee)-n(m.travel_cost)-n(m.other_cost);
function dashboard(){let low=products.filter(p=>p.stock<=p.min_stock);return `<h2>Deine Standzentrale</h2><div class="card"><b>Excel-Ausgaben: ${eur(expenses.reduce((a,x)=>a+n(x.eur),0))}</b><p class="muted">Bestellte Stückzahlen stehen in den Artikelnotizen; Lagerbestand zeigt eingegangene Stücke abzüglich Verkäufe.</p><button onclick="tab='expenses';render()">Alle Ausgaben ansehen</button></div><div class="card"><h3>Excel-Warenwirtschaft vollständig übernehmen</h3><p>Importiert die 45 Lagerpositionen aus deiner Excel-Tabelle mit Bestellmengen, eingegangenen Mengen, Preisen und bisherigen Ausgaben. Bereits eingegangene Ware ist in der Kasse verfügbar. Neue Lieferungen kannst du über + Wareneingang hinzufügen. Keine doppelten Excel-Importe anhand der SKU.</p><button id="importHistory" class="primary" onclick="importHistory()">Meine bisherigen Daten übernehmen</button></div><div class="grid"><div class="card"><small>Artikel</small><div class="metric">${products.length}</div></div><div class="card"><small>Märkte</small><div class="metric">${markets.length}</div></div><div class="card"><small>Verkäufe</small><div class="metric">${sales.filter(s=>!s.voided).length}</div></div><div class="card"><small>Gesamtumsatz</small><div class="metric">${eur(sales.filter(s=>!s.voided).reduce((a,s)=>a+n(s.total),0))}</div></div></div><div class="card"><h3>Nächste Märkte</h3>${markets.slice().sort((a,b)=>a.market_date.localeCompare(b.market_date)).map(m=>`<div class="item">${dt(m.market_date)} · <b>${e(m.name)}</b> · ${eur(m.stand_fee)} ${m.stand_fee_paid?'(bezahlt)':''}</div>`).join('')||'<p class="muted">Noch keine Märkte gespeichert.</p>'}<p><button onclick="tab='markets';render()">Marktverwaltung</button></p></div><div class="card"><h3>Bestand prüfen</h3>${low.slice(0,10).map(p=>`<div class="item">${e(p.name)} · ${p.stock} Stück</div>`).join('')||'Keine Warnungen'}<p class="muted">Neue Daten werden in Supabase gespeichert und nach erneuter Anmeldung geladen.</p></div>`}
function productView(){return `<div class="line"><h2>Warenlager</h2><button class="primary" onclick="editProduct()">+ Artikel</button></div>${products.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<div class="card"><div class="line"><div><b>${e(p.name)}</b> ${p.variant?`<small>${e(p.variant)}</small>`:''}<div class="muted">${e(p.category)} · ${p.stock} verfügbar · VK ${p.list_price==null?'offen':eur(p.list_price)} · EK ${p.purchase_price==null?'offen':eur(p.purchase_price)}</div><small>${e(p.notes||'')}</small></div><div class="row"><button onclick="toggleArrival('${p.id}')">${p.notes?.includes('[EINGETROFFEN]')?'✓ Angekommen':'○ Noch unterwegs'}</button><button onclick="receiveStock('${p.id}')">+ Wareneingang</button><button onclick="editProduct('${p.id}')">Bearbeiten</button><button ${p.notes?.includes('[EINGETROFFEN]')?'':'disabled title="Noch nicht als eingetroffen markiert"'} onclick="add('${p.id}');tab='pos';render()">Verkaufen</button></div></div></div>`).join('')||'<div class="card">Noch keine Produkte. Lege deinen ersten Artikel an.</div>'}`}
async function receiveStock(id){let p=products.find(x=>x.id===id);if(!p)return;let v=prompt('Wie viele Stück sind NEU eingetroffen? (Nicht die Gesamtmenge)', '1');if(v===null)return;let q=Number(v);if(!Number.isInteger(q)||q<=0)return msg('Bitte positive ganze Zahl eingeben.');try{await query('bs_products','update',{stock:n(p.stock)+q,notes:'[EINGETROFFEN] '+(p.notes||'').replace('[EINGETROFFEN]','').trim()},id);await refresh()}catch(err){msg(err.message)}}
async function toggleArrival(id){let p=products.find(x=>x.id===id);if(!p)return;let arrived=p.notes?.includes('[EINGETROFFEN]');let notes=arrived?(p.notes||'').replace('[EINGETROFFEN]','').trim():'[EINGETROFFEN] '+(p.notes||'');try{await query('bs_products','update',{notes},id);await refresh()}catch(err){msg(err.message)}}
function editProduct(id){let p=products.find(x=>x.id===id)||{};modal(`<h2>${id?'Artikel bearbeiten':'Neuer Artikel'}</h2><form onsubmit="saveProduct(event,${id?`'${id}'`:'null'})"><label>Artikelname</label><input name="name" required value="${e(p.name)}"><label>Kategorie</label><select name="category">${['Elektronik','Schmuck','Uhren','Accessoires','Sonstiges'].map(c=>`<option ${p.category===c?'selected':''}>${c}</option>`).join('')}</select><label>Modell / Farbe / Variante</label><input name="variant" value="${e(p.variant)}"><div class="grid"><div><label>VK €</label><input name="list_price" type="number" step=".01" min="0" value="${p.list_price??''}"></div><div><label>EK €</label><input name="purchase_price" type="number" step=".01" min="0" value="${p.purchase_price??''}"></div><div><label>Bestand</label><input name="stock" type="number" min="0" value="${p.stock??0}"></div><div><label>Mindestbestand</label><input name="min_stock" type="number" min="0" value="${p.min_stock??3}"></div></div><label>Notizen</label><textarea name="notes">${e(p.notes)}</textarea><p><button class="primary">Speichern</button></p></form>`)}
async function saveProduct(ev,id){ev.preventDefault();let f=new FormData(ev.target),data={name:f.get('name'),category:f.get('category'),variant:f.get('variant'),list_price:f.get('list_price')===''?null:n(f.get('list_price')),purchase_price:f.get('purchase_price')===''?null:n(f.get('purchase_price')),stock:n(f.get('stock')),min_stock:n(f.get('min_stock')),notes:f.get('notes')};try{if(id)await query('bs_products','update',data,id);else await query('bs_products','insert',{...data,user_id:user.id});el('dialog').close();await refresh()}catch(err){msg(err.message)}}
function marketView(){return `<div class="line"><h2>Flohmärkte</h2><button class="primary" onclick="editMarket()">+ Markt</button></div>${markets.slice().sort((a,b)=>a.market_date.localeCompare(b.market_date)).map(m=>`<div class="card"><div class="line"><div><b>${dt(m.market_date)} · ${e(m.name)}</b><p class="muted">${e(m.address)} · ${m.stand_meters||3} m · Standgebühr ${eur(m.stand_fee)} ${m.stand_fee_paid?'✓ bezahlt':'nicht bezahlt / unbekannt'}</p></div><button onclick="editMarket('${m.id}')">Bearbeiten</button></div></div>`).join('')||'<div class="card">Noch keine Märkte. Trage deine Termine ein.</div>'}`}
function editMarket(id){let m=markets.find(x=>x.id===id)||{};modal(`<h2>${id?'Markt bearbeiten':'Neuer Markt'}</h2><form onsubmit="saveMarket(event,${id?`'${id}'`:'null'})"><label>Datum</label><input type="date" name="market_date" required value="${e(m.market_date)}"><label>Name</label><input name="name" required value="${e(m.name)}"><label>Adresse</label><input name="address" value="${e(m.address)}"><div class="grid"><div><label>Standmeter</label><input name="stand_meters" type="number" step=".5" value="${m.stand_meters??3}"></div><div><label>Standgebühr €</label><input name="stand_fee" type="number" step=".01" value="${m.stand_fee??0}"></div><div><label>Fahrtkosten €</label><input name="travel_cost" type="number" step=".01" value="${m.travel_cost??0}"></div><div><label>Sonstige Kosten €</label><input name="other_cost" type="number" step=".01" value="${m.other_cost??0}"></div></div><label><input style="width:auto" type="checkbox" name="stand_fee_paid" ${m.stand_fee_paid?'checked':''}> Standgebühr bezahlt</label><label>Notizen</label><textarea name="notes">${e(m.notes)}</textarea><p><button class="primary">Speichern</button></p></form>`)}
async function saveMarket(ev,id){ev.preventDefault();let f=new FormData(ev.target),data={market_date:f.get('market_date'),name:f.get('name'),address:f.get('address'),stand_meters:n(f.get('stand_meters')),stand_fee:n(f.get('stand_fee')),travel_cost:n(f.get('travel_cost')),other_cost:n(f.get('other_cost')),stand_fee_paid:f.has('stand_fee_paid'),notes:f.get('notes')};try{if(id)await query('bs_markets','update',data,id);else await query('bs_markets','insert',{...data,user_id:user.id});el('dialog').close();await refresh()}catch(err){msg(err.message)}}
function add(id){let p=products.find(x=>x.id===id);if(!p)return;if(!p.notes?.includes('[EINGETROFFEN]'))return msg('Artikel zuerst im Warenlager als angekommen markieren.');let c=cart.find(x=>x.id===id);if(c)c.qty++;else cart.push({id:p.id,name:p.name,qty:1,price:n(p.list_price),list:n(p.list_price),cost:p.purchase_price});render()}
function pos(){let total=cart.reduce((a,c)=>a+c.qty*c.price,0);return `<h2>Schnellkasse · Flohmarkt & Online</h2><div class="card"><label>Verkaufskanal</label><select id="saleChannel" onchange="selectedChannel=this.value;document.getElementById('marketFields').style.display=this.value==='Flohmarkt'?'block':'none';document.getElementById('onlineFields').style.display=this.value==='Online'?'block':'none'"><option ${selectedChannel==='Flohmarkt'?'selected':''}>Flohmarkt</option><option ${selectedChannel==='Online'?'selected':''}>Online</option></select><div id="marketFields" style="display:${selectedChannel==='Flohmarkt'?'block':'none'}"><label>Flohmarkt auswählen</label><select id="marketid" onchange="selectedMarket=this.value">${markets.map(m=>`<option value="${m.id}" ${selectedMarket===m.id?'selected':''}>${dt(m.market_date)} · ${e(m.name)}</option>`).join('')}</select>${markets.length?'':'<p class="note">Für Flohmarktverkäufe bitte zuerst einen Markt anlegen.</p>'}</div><div id="onlineFields" style="display:${selectedChannel==='Online'?'block':'none'}"><label>Online-Plattform</label><select id="platform" onchange="selectedPlatform=this.value">${['eBay','Shopify','Instagram','Facebook','Sonstige'].map(x=>`<option ${selectedPlatform===x?'selected':''}>${x}</option>`).join('')}</select><label>Bestellnummer / Referenz (optional)</label><input id="orderref" value="${e(selectedOrder)}" oninput="selectedOrder=this.value" placeholder="z. B. eBay-Bestellnummer"></div><label>Verkaufsdatum</label><input type="date" id="saledate" value="${selectedDate}" onchange="selectedDate=this.value"></div><div class="grid">${products.filter(p=>n(p.stock)>0).map(p=>`<div class="card"><b>${e(/halskett|^kette$/i.test(p.name)?'Halsketten':p.name)}</b>${/halskett|^kette$/i.test(p.name)?`<small>${e(p.variant||p.name)}</small>`:''}<p class="gold">${p.list_price==null?'Preis offen':eur(p.list_price)}</p><small>${p.notes?.includes('[EINGETROFFEN]')?'Bestand: '+p.stock:'Bestellt: '+p.stock+' · Wareneingang offen'}</small><p><button ${p.notes?.includes('[EINGETROFFEN]')?'': 'disabled title="Zuerst Wareneingang im Warenlager bestätigen"'} onclick="add('${p.id}')">${p.notes?.includes('[EINGETROFFEN]')?'+ Hinzufügen':'Noch nicht eingetroffen'}</button></p></div>`).join('')}</div><div class="card"><h3>Warenkorb</h3>${cart.map((c,i)=>`<div class="item"><b>${e(c.name)}</b><div class="grid"><div><label>Menge</label><input type="number" min="1" value="${c.qty}" onchange="cart[${i}].qty=Math.max(1,n(this.value));render()"></div><div><label>Tatsächlicher Stückpreis €</label><input type="number" min="0" step=".01" value="${c.price}" onchange="cart[${i}].price=Math.max(0,n(this.value));render()"></div></div><div class="line"><small>Regulär ${eur(c.list)} · Jetzt ${eur(c.price*c.qty)}</small><button class="danger" onclick="cart.splice(${i},1);render()">Entfernen</button></div></div>`).join('')||'<p class="muted">Noch keine Artikel ausgewählt.</p>'}<div class="line"><h2>Endbetrag</h2><h2 class="gold">${eur(total)}</h2></div><label>Zahlungsart</label><select id="payment" onchange="selectedPayment=this.value">${['Bar','Karte','PayPal','Überweisung','Sonstige'].map(x=>`<option ${selectedPayment===x?'selected':''}>${x}</option>`).join('')}</select><p><button class="primary" ${!cart.length||busy?'disabled':''} onclick="checkout()">Verkauf speichern</button></p><p class="muted">Der ausgehandelte Preis zählt für den Verkauf. Für Online-Verkäufe werden Plattformgebühren und Versandkosten bei Ausgaben erfasst.</p></div>`}
async function checkout(){if(busy||!cart.length)return;let channel=el('saleChannel')?.value||'Flohmarkt',mid=channel==='Flohmarkt'?(el('marketid')?.value||null):null,payment=el('payment')?.value,platform=channel==='Online'?el('platform')?.value:null,orderref=channel==='Online'?el('orderref')?.value:null,saledate=el('saledate')?.value;if(channel==='Flohmarkt'&&!mid)return msg('Bitte zuerst einen Markt anlegen.');let fail=cart.find(c=>{let p=products.find(x=>x.id===c.id);return !p||!p.notes?.includes('[EINGETROFFEN]')||p.stock<c.qty});if(fail)return msg('Nicht eingetroffen oder zu wenig Bestand für '+fail.name+'.');if(!confirm(channel+'-Verkauf über '+eur(cart.reduce((a,c)=>a+c.qty*c.price,0))+' speichern?'))return;busy=true;let sale=null,adjusted=[];try{let cost=cart.reduce((a,c)=>a+c.qty*n(c.cost),0),total=cart.reduce((a,c)=>a+c.qty*c.price,0);sale=(await query('bs_sales','insert',{user_id:user.id,market_id:mid,payment_method:payment,total,cost_total:cost,sale_channel:channel,platform,order_ref:orderref,sale_date:saledate}))[0];await query('bs_sale_items','insert',cart.map(c=>({user_id:user.id,sale_id:sale.id,product_id:c.id,product_name:c.name,quantity:c.qty,list_price:c.list,actual_unit_price:c.price,unit_cost:c.cost})));for(let c of cart){let p=products.find(x=>x.id===c.id);await query('bs_products','update',{stock:p.stock-c.qty},c.id);adjusted.push(c)}cart=[];selectedOrder="";msg('Verkauf gespeichert: '+eur(total));}catch(err){if(sale){try{for(let c of adjusted){let p=products.find(x=>x.id===c.id);await query('bs_products','update',{stock:p.stock},c.id)}await query('bs_sales','delete',null,sale.id)}catch{msg('Bitte Bestand und Verkauf prüfen: Rückabwicklung fehlgeschlagen.')}}msg('Fehler: '+err.message)}finally{busy=false;await refresh()}}
function reports(){return `<h2>Tages- und Marktabrechnung</h2><p class="note">Vorläufiges Ergebnis vor Steuern und allgemeinen Betriebskosten. Fehlende Einkaufspreise werden als 0 € berücksichtigt; bitte nachtragen.</p>${markets.map(m=>`<div class="card"><h3>${dt(m.market_date)} · ${e(m.name)}</h3><div class="line"><span>Tatsächlicher Umsatz</span><b>${eur(sumMarket(m))}</b></div><div class="line"><span>Wareneinsatz (soweit hinterlegt)</span><b>− ${eur(costMarket(m))}</b></div><div class="line"><span>Standgebühr</span><b>− ${eur(m.stand_fee)}</b></div><div class="line"><span>Fahrt und Sonstiges</span><b>− ${eur(n(m.travel_cost)+n(m.other_cost))}</b></div><hr><div class="line"><b>Vorläufiges Ergebnis</b><b class="gold">${eur(profit(m))}</b></div><p><button onclick="showSales('${m.id}')">Verkäufe ansehen</button></p></div>`).join('')}`}
function showSales(mid){let ss=sales.filter(s=>s.market_id===mid);modal(`<h2>Verkäufe</h2>${ss.map(s=>`<div class="item"><b>${new Date(s.created_at).toLocaleString('de-DE')} · ${eur(s.total)}</b> <small>${e(s.payment_method)} ${s.voided?'· STORNIERT':''}</small><div>${items.filter(i=>i.sale_id===s.id).map(i=>`${e(i.product_name)}: ${i.quantity} × ${eur(i.actual_unit_price)}`).join('<br>')}</div>${s.voided?'':`<p><button class="danger" onclick="voidSale('${s.id}')">Stornieren</button></p>`}</div>`).join('')||'Keine Verkäufe'}`)}
async function voidSale(id){if(!confirm('Verkauf stornieren und Bestand zurückbuchen?'))return;let s=sales.find(x=>x.id===id);if(!s||s.voided)return;try{await query('bs_sales','update',{voided:true},id);for(let i of items.filter(x=>x.sale_id===id)){let p=products.find(x=>x.id===i.product_id);if(p)await query('bs_products','update',{stock:p.stock+i.quantity},p.id)}el('dialog').close();await refresh()}catch(err){msg('Storno nicht vollständig. Bitte prüfen: '+err.message)}}
function taskView(){return `<h2>Aufgaben</h2><div class="card"><form onsubmit="saveTask(event)"><label>Aufgabe</label><input name="title" required placeholder="z. B. Schmuck nachbestellen"><label>Fällig am</label><input type="date" name="due_date"><p><button class="primary">Speichern</button></p></form></div>${tasks.map(t=>`<div class="card line"><label><input style="width:auto" type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}',this.checked)"> ${e(t.title)} · ${dt(t.due_date)}</label></div>`).join('')}`}
async function saveTask(ev){ev.preventDefault();let f=new FormData(ev.target);try{await query('bs_tasks','insert',{user_id:user.id,title:f.get('title'),due_date:f.get('due_date')||null});await refresh()}catch(err){msg(err.message)}}async function toggleTask(id,done){try{await query('bs_tasks','update',{done},id);await refresh()}catch(err){msg(err.message)}}

async function importHistory(){
if(!user)return msg('Bitte anmelden.');
if(!confirm('Excel-Warenwirtschaft mit Artikeln, Wareneingängen, Ausgaben und Märkten übernehmen? Vorhandene Datensätze werden nicht überschrieben.'))return;
let b=el('importHistory');if(b)b.disabled=true;
try{
let known=new Set(products.map(p=>p.sku).filter(Boolean));
let fresh=excelProducts.filter(p=>!known.has(p.sku)).map(p=>({user_id:user.id,sku:p.sku,name:p.name,category:p.category,variant:p.variant,stock:p.arrived,list_price:p.price,purchase_price:p.cost,min_stock:3,notes:(p.arrived>0?'[EINGETROFFEN] ':'')+p.notes}));
if(fresh.length)await query('bs_products','insert',fresh);
let knownDates=new Set(markets.map(m=>m.market_date));let newMarkets=initialMarkets.filter(m=>!knownDates.has(m.market_date)).map(m=>({...m,user_id:user.id}));if(newMarkets.length)await query('bs_markets','insert',newMarkets);
let expKnown=new Set(expenses.map(x=>x.import_key).filter(Boolean));let newExpenses=excelExpenses.map((x,i)=>({...x,user_id:user.id,import_key:'excel2026_'+i})).filter(x=>!expKnown.has(x.import_key));
if(newExpenses.length)await query('bs_expenses','insert',newExpenses);
await refresh();msg('Übernommen: '+fresh.length+' Lagerpositionen, '+newExpenses.length+' Ausgaben, '+newMarkets.length+' Märkte. Bereits vorhandene Datensätze wurden nicht überschrieben.');
}catch(err){await refresh();msg('Import nicht vollständig: '+err.message+' – bitte SQL für Ausgaben prüfen.')}finally{let b=el('importHistory');if(b)b.disabled=false}
}

function filteredSales(){let from=el('taxFrom')?.value||'',to=el('taxTo')?.value||'',ch=el('taxChannel')?.value||'Alle';return sales.filter(s=>{let d=s.sale_date||String(s.created_at||'').slice(0,10),c=s.sale_channel||'Flohmarkt';return !s.voided&&(!from||d>=from)&&(!to||d<=to)&&(ch==='Alle'||ch===c)}).sort((a,b)=>String(a.sale_date||a.created_at).localeCompare(String(b.sale_date||b.created_at)))}
function filteredExpenses(){let from=el('taxFrom')?.value||'',to=el('taxTo')?.value||'';return expenses.filter(x=>(!from||String(x.date||'')>=from)&&(!to||String(x.date||'')<=to))}
function taxView(){let year=new Date().getFullYear();return `<h2>Steuerexport & Verkaufsjournal</h2><p class="note">Für Steuerberater / Finanzamt: Einzelverkäufe, Zahlungsarten, Kanäle, Ausgaben und Belege. Keine fertige Steuererklärung und keine amtliche Buchführung. Originalbelege bitte aufbewahren.</p><div class="card"><div class="grid"><div><label>Von</label><input type="date" id="taxFrom" value="${year}-01-01"></div><div><label>Bis</label><input type="date" id="taxTo" value="${year}-12-31"></div></div><label>Verkaufskanal</label><select id="taxChannel"><option>Alle</option><option>Flohmarkt</option><option>Online</option></select><p class="row"><button class="primary" onclick="printTax()">Druckansicht / PDF</button><button onclick="exportSalesCsv()">Verkäufe CSV</button><button onclick="exportExpensesCsv()">Ausgaben CSV</button></p><small>Auf dem iPhone in der Druckvorschau über Teilen als PDF sichern; auf MacBook drucken oder als PDF speichern.</small></div><div class="card"><h3>Auswertung</h3><button onclick="taxPreview()">Zeitraum berechnen</button><div id="taxPreview"></div></div>`}
function taxPreview(){let ss=filteredSales(),xx=filteredExpenses(),market=ss.filter(s=>(s.sale_channel||'Flohmarkt')==='Flohmarkt'),online=ss.filter(s=>s.sale_channel==='Online'),sum=a=>a.reduce((v,s)=>v+n(s.total),0),cost=ss.reduce((v,s)=>v+n(s.cost_total),0),exp=xx.reduce((v,x)=>v+n(x.eur),0);el('taxPreview').innerHTML=`<p>Verkäufe: <b>${ss.length}</b> · Flohmarkt ${eur(sum(market))} · Online ${eur(sum(online))}</p><p>Umsatz gesamt: <b>${eur(sum(ss))}</b> · Ausgaben im Zeitraum: ${eur(exp)}</p><p>Wareneinsatz der Verkäufe (soweit erfasst): ${eur(cost)}</p><p class="muted">Achtung: Wareneinsatz und bereits als Einkaufsausgaben gebuchte Ware nicht doppelt abziehen. Zahlungszufluss, Umsatzsteuer und steuerlicher Gewinn sind gesondert zu prüfen.</p>`}
function taxRows(){let ss=filteredSales(),rows=[];for(let s of ss){let market=markets.find(m=>m.id===s.market_id),date=s.sale_date||String(s.created_at||'').slice(0,10);for(let i of items.filter(i=>i.sale_id===s.id)){rows.push({date,channel:s.sale_channel||'Flohmarkt',place:s.sale_channel==='Online'?(s.platform||'Online'):(market?.name||'Flohmarkt'),order:s.order_ref||s.id,payment:s.payment_method,name:i.product_name,qty:n(i.quantity),unit:n(i.actual_unit_price),total:n(i.quantity)*n(i.actual_unit_price),cost:n(i.quantity)*n(i.unit_cost)})}}return rows}
function printTax(){let rows=taxRows(),xx=filteredExpenses(),sum=(a,k)=>a.reduce((v,x)=>v+n(x[k]),0),from=el('taxFrom')?.value||'Beginn',to=el('taxTo')?.value||'Ende',table=(heads,data)=>`<table><thead><tr>${heads.map(h=>`<th>${e(h)}</th>`).join('')}</tr></thead><tbody>${data.join('')}</tbody></table>`;let salesTable=table(['Datum','Kanal / Ort','Artikel','Menge','Stückpreis','Einnahme','Zahlung / Referenz'],rows.map(r=>`<tr><td>${e(r.date)}</td><td>${e(r.channel+' · '+r.place)}</td><td>${e(r.name)}</td><td>${r.qty}</td><td>${eur(r.unit)}</td><td>${eur(r.total)}</td><td>${e(r.payment+' · '+r.order)}</td></tr>`));let expenseTable=table(['Datum','Kategorie','Beschreibung','Betrag','Quelle'],xx.map(x=>`<tr><td>${e(x.date)}</td><td>${e(x.category)}</td><td>${e(x.description)}</td><td>${eur(x.eur)}</td><td>${e(x.source)}</td></tr>`));let html=`<h1>BIBANI SELECT · Verkaufs- und Ausgabenjournal</h1><p>Zeitraum: ${e(from)} bis ${e(to)} · Erstellt: ${new Date().toLocaleString('de-DE')}</p><h2>Umsatzübersicht</h2><p>Flohmarkt: ${eur(sum(rows.filter(r=>r.channel==='Flohmarkt'),'total'))} · Online: ${eur(sum(rows.filter(r=>r.channel==='Online'),'total'))} · Gesamt: <b>${eur(sum(rows,'total'))}</b></p><p>Ausgaben (erfasst): ${eur(sum(xx,'eur'))} · Warenkosten der Verkäufe (soweit bekannt): ${eur(sum(rows,'cost'))}</p><h2>Einzelverkäufe (${rows.length} Positionen)</h2>${salesTable}<h2>Ausgaben (${xx.length})</h2>${expenseTable}<p>Hinweis: Interner Nachweis, keine Rechnung oder amtliche Steuererklärung. Belege, Zahlungsnachweise und Gebühren separat aufbewahren. Warenkosten nicht doppelt als Aufwand zählen.</p>`;el('print-area').innerHTML=html;window.print()}
function csvEscape(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function downloadCsv(filename,headers,rows){let data='\uFEFF'+[headers,...rows].map(row=>row.map(csvEscape).join(';')).join('\r\n'),blob=new Blob([data],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportSalesCsv(){downloadCsv('Bibani_Select_Verkaufsjournal.csv',['Datum','Kanal','Plattform/Markt','Referenz','Zahlungsart','Artikel','Menge','Stückpreis EUR','Umsatz EUR','Warenkosten EUR'],taxRows().map(r=>[r.date,r.channel,r.place,r.order,r.payment,r.name,r.qty,r.unit.toFixed(2).replace('.',','),r.total.toFixed(2).replace('.',','),r.cost.toFixed(2).replace('.',',')]))}
function exportExpensesCsv(){downloadCsv('Bibani_Select_Ausgaben.csv',['Datum','Kategorie','Beschreibung','Betrag EUR','Quelle','Notiz'],filteredExpenses().map(x=>[x.date,x.category,x.description,n(x.eur).toFixed(2).replace('.',','),x.source,x.note]))}

function expenseView(){let sum=expenses.reduce((a,x)=>a+n(x.eur),0);let turnover=sales.filter(s=>!s.voided).reduce((a,x)=>a+n(x.total),0);return `<div class="line"><h2>Ausgaben & Finanzen</h2><button class="primary" onclick="editExpense()">+ Ausgabe</button></div><div class="grid"><div class="card"><small>Ausgaben gesamt</small><div class="metric">${eur(sum)}</div></div><div class="card"><small>Umsatz</small><div class="metric">${eur(turnover)}</div></div></div><div class="card"><b>Zahlungsdifferenz</b><div class="metric">${eur(turnover-sum)}</div><small>Umsatz minus erfasste Ausgaben; kein steuerlicher Gewinn. Marktgebühren nur berücksichtigen, wenn hier gebucht.</small></div>${expenses.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>`<div class="card"><div class="line"><div><b>${e(x.description)}</b><div class="muted">${e(x.date||'')} · ${e(x.category||'')} · ${e(x.source||'')}</div><small>${e(x.note||'')}</small></div><div><b>${eur(x.eur)}</b><p><button onclick="editExpense('${x.id}')">Bearbeiten</button></p></div></div></div>`).join('')||'<div class="card">Noch keine Ausgaben. Bitte zuerst Excel-Daten importieren und SQL-Tabelle anlegen.</div>'}`}
function editExpense(id){let x=expenses.find(z=>z.id===id)||{};modal(`<h2>${id?'Ausgabe bearbeiten':'Neue Ausgabe'}</h2><form onsubmit="saveExpense(event,${id?`'${id}'`:'null'})"><label>Datum</label><input type="date" name="date" value="${e(x.date||new Date().toISOString().slice(0,10))}"><label>Kategorie</label><input name="category" value="${e(x.category||'Sonstiges')}"><label>Beschreibung</label><input name="description" required value="${e(x.description||'')}"><label>Betrag EUR</label><input type="number" step="0.01" min="0" required name="eur" value="${x.eur??''}"><label>Quelle</label><input name="source" value="${e(x.source||'')}"><label>Notiz</label><textarea name="note">${e(x.note||'')}</textarea><p><button class="primary" type="submit">Speichern</button></p></form>`)}
async function saveExpense(ev,id){ev.preventDefault();let f=new FormData(ev.target),d={date:f.get('date')||null,category:f.get('category'),description:f.get('description'),eur:Number(f.get('eur')),source:f.get('source'),note:f.get('note')};try{if(id)await query('bs_expenses','update',d,id);else await query('bs_expenses','insert',{...d,user_id:user.id,currency:'EUR',original:d.eur});closeModal();await refresh()}catch(err){msg(err.message)}}

async function logout(){await sb.auth.signOut();user=null;products=[];markets=[];sales=[];items=[];tasks=[];cart=[];el('private').classList.add('hide');el('login').classList.remove('hide');el('logout').classList.add('hide')}
async function signedIn(u){user=u;el('private').classList.remove('hide');el('login').classList.add('hide');el('logout').classList.remove('hide');await refresh()}
el('loginform').addEventListener('submit',async ev=>{ev.preventDefault();el('loginmsg').textContent='Anmeldung läuft …';try{if(!sb)throw Error('Bibliothek konnte nicht geladen werden. Internetverbindung prüfen.');let {data,error}=await sb.auth.signInWithPassword({email:el('email').value,password:el('password').value});if(error)throw error;el('password').value='';el('loginmsg').textContent='';await signedIn(data.user)}catch(err){el('loginmsg').textContent='Anmeldung fehlgeschlagen: '+err.message}});
(async()=>{if(!sb){el('loginmsg').textContent='Internetverbindung erforderlich: Supabase-Bibliothek nicht geladen.';return}let {data}=await sb.auth.getUser();if(data.user)await signedIn(data.user)})();
</script><div id="print-area"></div><script src="bibani-update.js"></script></body></html>
