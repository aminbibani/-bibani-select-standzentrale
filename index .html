*{box-sizing:border-box}body{margin:0;background:#101113;color:#f5f0e7;font:15px system-ui,-apple-system,sans-serif}header{padding:18px;background:#1b1b1d;border-bottom:1px solid #594b31;display:flex;justify-content:space-between;align-items:center}header strong{color:#e4bf73;letter-spacing:2px;font-size:19px}main{max-width:960px;margin:auto;padding:16px 14px 80px}.card{background:#1d1e21;border:1px solid #3a3730;border-radius:15px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid>.card{margin:0}.line{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.muted,small{color:#aaa}.gold{color:#e5bd6f}h1{font-size:24px}h2{font-size:20px}h3{font-size:17px}button{border:1px solid #6b5938;background:#302a22;color:#f8e5bb;padding:11px 13px;border-radius:10px;font-weight:600;cursor:pointer}button.primary{background:#d7b26d;color:#18120b}button.danger{color:#ffb8b8;border-color:#945151}button:disabled{opacity:.45}input,select,textarea{background:#101113;border:1px solid #625b4e;color:#fff;border-radius:9px;padding:11px;width:100%;font:inherit}label{display:block;margin:10px 0 5px;color:#dfcfaf;font-size:13px}nav{display:flex;gap:7px;overflow:auto;padding:10px;background:#191a1c;position:sticky;top:0;z-index:2}nav button{white-space:nowrap}nav button.active{background:#d7b26d;color:#17130e}.item{padding:12px 0;border-bottom:1px solid #373737}.item:last-child{border:0}.metric{font-size:25px;font-weight:750;color:#e4bf73}.note{background:#2c281f;border-left:3px solid #cfa95f;padding:12px;border-radius:4px}dialog{background:#222327;color:#fff;border:1px solid #9b7b45;border-radius:16px;width:min(94vw,520px);max-height:85vh;overflow:auto}dialog::backdrop{background:#000b}.hide{display:none!important}@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><div><strong>◆ BIBANI SELECT</strong><div class="muted" style="font-size:12px">Private Cloud-Standzentrale</div></div><button id="logout" class="hide" onclick="logout()">Abmelden</button></header><div id="login"><main><div class="card" style="max-width:460px;margin:40px auto"><h1>Privater Login</h1><p class="muted">Melde dich mit dem Benutzer an, den du unter Supabase → Authentication → Users erstellt hast.</p><form id="loginform"><label>E-Mail</label><input id="email" type="email" autocomplete="username" required><label>Passwort</label><input id="password" type="password" autocomplete="current-password" required><p><button class="primary" type="submit">Anmelden</button></p></form><p id="loginmsg" class="muted"></p><p class="muted" style="font-size:12px">Nur bestehende Benutzer können sich anmelden. Es gibt keine öffentliche Registrierung.</p></div></main></div><div id="private" class="hide"><nav id="tabs"></nav><main id="content"></main></div><dialog id="dialog"><div id="modal"></div><p><button onclick="document.getElementById('dialog').close()">Schließen</button></p></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
'use strict';
const PROJECT='https://jdvadltxoqbldsrvrpjq.supabase.co';
const PUBLISHABLE='sb_publishable_lx5Snif1re1Z3tz_6rZCbg__B5D4d7n';
const sb=window.supabase?.createClient(PROJECT,PUBLISHABLE,{auth:{persistSession:true,autoRefreshToken:true}});
let user=null,tab='dashboard',products=[],markets=[],sales=[],items=[],tasks=[],cart=[],busy=false;
const el=id=>document.getElementById(id),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),eur=n=>(Number(n)||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'}),dt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('de-DE'):'',n=v=>Number(v)||0;
function msg(t){alert(t)}function modal(s){el('modal').innerHTML=s;el('dialog').showModal()}
async function query(table,method='select',data=null,filter=null){let q=sb.from(table);if(method==='select'){q=q.select('*');if(filter)q=q.eq(filter[0],filter[1])}else if(method==='insert')q=q.insert(data).select('*');else if(method==='update')q=q.update(data).eq('id',filter).select('*');else if(method==='delete')q=q.delete().eq('id',filter);const {data:result,error}=await q;if(error)throw Error(error.message);return result||[]}
async function refresh(){try{[products,markets,sales,items,tasks]=await Promise.all(['bs_products','bs_markets','bs_sales','bs_sale_items','bs_tasks'].map(t=>query(t)));render()}catch(err){msg('Datenbankfehler: '+err.message)}}
function render(){if(!user)return;let nav=[['dashboard','Übersicht'],['pos','Schnellkasse'],['products','Warenlager'],['markets','Märkte'],['reports','Abrechnung'],['tasks','Aufgaben']];el('tabs').innerHTML=nav.map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="tab='${k}';render()">${v}</button>`).join('');el('content').innerHTML=({dashboard, pos,productView,marketView,reports,taskView})[{dashboard:'dashboard',pos:'pos',products:'productView',markets:'marketView',reports:'reports',tasks:'taskView'}[tab]]()}
const sumMarket=m=>sales.filter(s=>s.market_id===m.id&&!s.voided).reduce((a,s)=>a+n(s.total),0),costMarket=m=>sales.filter(s=>s.market_id===m.id&&!s.voided).reduce((a,s)=>a+n(s.cost_total),0),profit=m=>sumMarket(m)-costMarket(m)-n(m.stand_fee)-n(m.travel_cost)-n(m.other_cost);
function dashboard(){let low=products.filter(p=>p.stock<=p.min_stock);return `<h2>Deine Standzentrale</h2><div class="card"><h3>Deine bisherigen Waren & Märkte übernehmen</h3><p>Ich habe die bekannten Bestellungen, 45 vorhandene Armbänder, die Schmuck-Kategorien und vier Flohmarkttermine vorbereitet. Bestellmengen stehen direkt im Bestand (nicht gleichbedeutend mit bereits eingetroffener Ware). Markiere per Knopfdruck, was tatsächlich angekommen ist; nur diese Artikel erscheinen in der Verkaufskasse. Unklare Mengen bleiben 0 oder sind als vorläufig gekennzeichnet.</p><button id="importHistory" class="primary" onclick="importHistory()">Meine bisherigen Daten übernehmen</button></div><div class="grid"><div class="card"><small>Artikel</small><div class="metric">${products.length}</div></div><div class="card"><small>Märkte</small><div class="metric">${markets.length}</div></div><div class="card"><small>Verkäufe</small><div class="metric">${sales.filter(s=>!s.voided).length}</div></div><div class="card"><small>Gesamtumsatz</small><div class="metric">${eur(sales.filter(s=>!s.voided).reduce((a,s)=>a+n(s.total),0))}</div></div></div><div class="card"><h3>Nächste Märkte</h3>${markets.slice().sort((a,b)=>a.market_date.localeCompare(b.market_date)).map(m=>`<div class="item">${dt(m.market_date)} · <b>${e(m.name)}</b> · ${eur(m.stand_fee)} ${m.stand_fee_paid?'(bezahlt)':''}</div>`).join('')||'<p class="muted">Noch keine Märkte gespeichert.</p>'}<p><button onclick="tab='markets';render()">Marktverwaltung</button></p></div><div class="card"><h3>Bestand prüfen</h3>${low.slice(0,10).map(p=>`<div class="item">${e(p.name)} · ${p.stock} Stück</div>`).join('')||'Keine Warnungen'}<p class="muted">Neue Daten werden in Supabase gespeichert und nach erneuter Anmeldung geladen.</p></div>`}
function productView(){return `<div class="line"><h2>Warenlager</h2><button class="primary" onclick="editProduct()">+ Artikel</button></div>${products.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<div class="card"><div class="line"><div><b>${e(p.name)}</b> ${p.variant?`<small>${e(p.variant)}</small>`:''}<div class="muted">${e(p.category)} · ${p.stock} Stück · VK ${p.list_price==null?'offen':eur(p.list_price)} · EK ${p.purchase_price==null?'offen':eur(p.purchase_price)}</div></div><div class="row"><button onclick="toggleArrival('${p.id}')">${p.notes?.includes('[EINGETROFFEN]')?'✓ Angekommen':'○ Noch unterwegs'}</button><button onclick="editProduct('${p.id}')">Bearbeiten</button><button ${p.notes?.includes('[EINGETROFFEN]')?'':'disabled title="Noch nicht als eingetroffen markiert"'} onclick="add('${p.id}');tab='pos';render()">Verkaufen</button></div></div></div>`).join('')||'<div class="card">Noch keine Produkte. Lege deinen ersten Artikel an.</div>'}`}
async function toggleArrival(id){let p=products.find(x=>x.id===id);if(!p)return;let arrived=p.notes?.includes('[EINGETROFFEN]');let notes=arrived?(p.notes||'').replace('[EINGETROFFEN]','').trim():'[EINGETROFFEN] '+(p.notes||'');try{await query('bs_products','update',{notes},id);await refresh()}catch(err){msg(err.message)}}
function editProduct(id){let p=products.find(x=>x.id===id)||{};modal(`<h2>${id?'Artikel bearbeiten':'Neuer Artikel'}</h2><form onsubmit="saveProduct(event,${id?`'${id}'`:'null'})"><label>Artikelname</label><input name="name" required value="${e(p.name)}"><label>Kategorie</label><select name="category">${['Elektronik','Schmuck','Uhren','Accessoires','Sonstiges'].map(c=>`<option ${p.category===c?'selected':''}>${c}</option>`).join('')}</select><label>Modell / Farbe / Variante</label><input name="variant" value="${e(p.variant)}"><div class="grid"><div><label>VK €</label><input name="list_price" type="number" step=".01" min="0" value="${p.list_price??''}"></div><div><label>EK €</label><input name="purchase_price" type="number" step=".01" min="0" value="${p.purchase_price??''}"></div><div><label>Bestand</label><input name="stock" type="number" min="0" value="${p.stock??0}"></div><div><label>Mindestbestand</label><input name="min_stock" type="number" min="0" value="${p.min_stock??3}"></div></div><label>Notizen</label><textarea name="notes">${e(p.notes)}</textarea><p><button class="primary">Speichern</button></p></form>`)}
async function saveProduct(ev,id){ev.preventDefault();let f=new FormData(ev.target),data={name:f.get('name'),category:f.get('category'),variant:f.get('variant'),list_price:f.get('list_price')===''?null:n(f.get('list_price')),purchase_price:f.get('purchase_price')===''?null:n(f.get('purchase_price')),stock:n(f.get('stock')),min_stock:n(f.get('min_stock')),notes:f.get('notes')};try{if(id)await query('bs_products','update',data,id);else await query('bs_products','insert',{...data,user_id:user.id});el('dialog').close();await refresh()}catch(err){msg(err.message)}}
function marketView(){return `<div class="line"><h2>Flohmärkte</h2><button class="primary" onclick="editMarket()">+ Markt</button></div>${markets.slice().sort((a,b)=>a.market_date.localeCompare(b.market_date)).map(m=>`<div class="card"><div class="line"><div><b>${dt(m.market_date)} · ${e(m.name)}</b><p class="muted">${e(m.address)} · ${m.stand_meters||3} m · Standgebühr ${eur(m.stand_fee)} ${m.stand_fee_paid?'✓ bezahlt':'nicht bezahlt / unbekannt'}</p></div><button onclick="editMarket('${m.id}')">Bearbeiten</button></div></div>`).join('')||'<div class="card">Noch keine Märkte. Trage deine Termine ein.</div>'}`}
function editMarket(id){let m=markets.find(x=>x.id===id)||{};modal(`<h2>${id?'Markt bearbeiten':'Neuer Markt'}</h2><form onsubmit="saveMarket(event,${id?`'${id}'`:'null'})"><label>Datum</label><input type="date" name="market_date" required value="${e(m.market_date)}"><label>Name</label><input name="name" required value="${e(m.name)}"><label>Adresse</label><input name="address" value="${e(m.address)}"><div class="grid"><div><label>Standmeter</label><input name="stand_meters" type="number" step=".5" value="${m.stand_meters??3}"></div><div><label>Standgebühr €</label><input name="stand_fee" type="number" step=".01" value="${m.stand_fee??0}"></div><div><label>Fahrtkosten €</label><input name="travel_cost" type="number" step=".01" value="${m.travel_cost??0}"></div><div><label>Sonstige Kosten €</label><input name="other_cost" type="number" step=".01" value="${m.other_cost??0}"></div></div><label><input style="width:auto" type="checkbox" name="stand_fee_paid" ${m.stand_fee_paid?'checked':''}> Standgebühr bezahlt</label><label>Notizen</label><textarea name="notes">${e(m.notes)}</textarea><p><button class="primary">Speichern</button></p></form>`)}
async function saveMarket(ev,id){ev.preventDefault();let f=new FormData(ev.target),data={market_date:f.get('market_date'),name:f.get('name'),address:f.get('address'),stand_meters:n(f.get('stand_meters')),stand_fee:n(f.get('stand_fee')),travel_cost:n(f.get('travel_cost')),other_cost:n(f.get('other_cost')),stand_fee_paid:f.has('stand_fee_paid'),notes:f.get('notes')};try{if(id)await query('bs_markets','update',data,id);else await query('bs_markets','insert',{...data,user_id:user.id});el('dialog').close();await refresh()}catch(err){msg(err.message)}}
function add(id){let p=products.find(x=>x.id===id);if(!p)return;if(!p.notes?.includes('[EINGETROFFEN]'))return msg('Artikel zuerst im Warenlager als angekommen markieren.');let c=cart.find(x=>x.id===id);if(c)c.qty++;else cart.push({id:p.id,name:p.name,qty:1,price:n(p.list_price),list:n(p.list_price),cost:p.purchase_price});render()}
function pos(){let total=cart.reduce((a,c)=>a+c.qty*c.price,0);return `<h2>Schnellkasse</h2><div class="card"><label>Markt auswählen</label><select id="marketid">${markets.map(m=>`<option value="${m.id}">${dt(m.market_date)} · ${e(m.name)}</option>`).join('')}</select>${markets.length?'':'<p class="note">Lege zuerst einen Markt an.</p>'}</div><div class="grid">${products.filter(p=>p.notes?.includes('[EINGETROFFEN]')).map(p=>`<div class="card"><b>${e(p.name)}</b><p class="gold">${p.list_price==null?'Preis offen':eur(p.list_price)}</p><small>Bestand: ${p.stock}</small><p><button onclick="add('${p.id}')">+ Hinzufügen</button></p></div>`).join('')}</div><div class="card"><h3>Warenkorb</h3>${cart.map((c,i)=>`<div class="item"><b>${e(c.name)}</b><div class="grid"><div><label>Menge</label><input type="number" min="1" value="${c.qty}" onchange="cart[${i}].qty=Math.max(1,n(this.value));render()"></div><div><label>Tatsächlicher Stückpreis €</label><input type="number" min="0" step=".01" value="${c.price}" onchange="cart[${i}].price=Math.max(0,n(this.value));render()"></div></div><div class="line"><small>Regulär ${eur(c.list)} · Jetzt ${eur(c.price*c.qty)}</small><button class="danger" onclick="cart.splice(${i},1);render()">Entfernen</button></div></div>`).join('')||'<p class="muted">Noch keine Artikel ausgewählt.</p>'}<div class="line"><h2>Endbetrag</h2><h2 class="gold">${eur(total)}</h2></div><label>Zahlungsart</label><select id="payment"><option>Bar</option><option>Karte</option><option>Sonstige</option></select><p><button class="primary" ${!cart.length||!markets.length||busy?'disabled':''} onclick="checkout()">Verkauf speichern</button></p><p class="muted">Der geänderte Preis zählt für diesen Verkauf, nicht für den Standardpreis.</p></div>`}
async function checkout(){if(busy||!cart.length)return;let mid=el('marketid')?.value,payment=el('payment')?.value;if(!mid)return msg('Bitte zuerst einen Markt anlegen.');let fail=cart.find(c=>{let p=products.find(x=>x.id===c.id);return !p||!p.notes?.includes('[EINGETROFFEN]')||p.stock<c.qty});if(fail)return msg('Nicht eingetroffen oder zu wenig Bestand für '+fail.name+'. Bitte Bestand zuerst prüfen.');if(!confirm('Verkauf über '+eur(cart.reduce((a,c)=>a+c.qty*c.price,0))+' verbindlich speichern?'))return;busy=true;let sale=null,adjusted=[];try{let cost=cart.reduce((a,c)=>a+c.qty*n(c.cost),0),total=cart.reduce((a,c)=>a+c.qty*c.price,0);sale=(await query('bs_sales','insert',{user_id:user.id,market_id:mid,payment_method:payment,total,cost_total:cost}))[0];await query('bs_sale_items','insert',cart.map(c=>({user_id:user.id,sale_id:sale.id,product_id:c.id,product_name:c.name,quantity:c.qty,list_price:c.list,actual_unit_price:c.price,unit_cost:c.cost})));for(let c of cart){let p=products.find(x=>x.id===c.id);await query('bs_products','update',{stock:p.stock-c.qty},c.id);adjusted.push(c)}cart=[];msg('Verkauf gespeichert: '+eur(total));}catch(err){if(sale){try{for(let c of adjusted){let p=products.find(x=>x.id===c.id);await query('bs_products','update',{stock:p.stock},c.id)}await query('bs_sales','delete',null,sale.id)}catch{msg('Bitte Bestand und Verkauf im Dashboard prüfen: Rückabwicklung fehlgeschlagen.')}}msg('Fehler: '+err.message)}finally{busy=false;await refresh()}}
function reports(){return `<h2>Tages- und Marktabrechnung</h2><p class="note">Vorläufiges Ergebnis vor Steuern und allgemeinen Betriebskosten. Fehlende Einkaufspreise werden als 0 € berücksichtigt; bitte nachtragen.</p>${markets.map(m=>`<div class="card"><h3>${dt(m.market_date)} · ${e(m.name)}</h3><div class="line"><span>Tatsächlicher Umsatz</span><b>${eur(sumMarket(m))}</b></div><div class="line"><span>Wareneinsatz (soweit hinterlegt)</span><b>− ${eur(costMarket(m))}</b></div><div class="line"><span>Standgebühr</span><b>− ${eur(m.stand_fee)}</b></div><div class="line"><span>Fahrt und Sonstiges</span><b>− ${eur(n(m.travel_cost)+n(m.other_cost))}</b></div><hr><div class="line"><b>Vorläufiges Ergebnis</b><b class="gold">${eur(profit(m))}</b></div><p><button onclick="showSales('${m.id}')">Verkäufe ansehen</button></p></div>`).join('')}`}
function showSales(mid){let ss=sales.filter(s=>s.market_id===mid);modal(`<h2>Verkäufe</h2>${ss.map(s=>`<div class="item"><b>${new Date(s.created_at).toLocaleString('de-DE')} · ${eur(s.total)}</b> <small>${e(s.payment_method)} ${s.voided?'· STORNIERT':''}</small><div>${items.filter(i=>i.sale_id===s.id).map(i=>`${e(i.product_name)}: ${i.quantity} × ${eur(i.actual_unit_price)}`).join('<br>')}</div>${s.voided?'':`<p><button class="danger" onclick="voidSale('${s.id}')">Stornieren</button></p>`}</div>`).join('')||'Keine Verkäufe'}`)}
async function voidSale(id){if(!confirm('Verkauf stornieren und Bestand zurückbuchen?'))return;let s=sales.find(x=>x.id===id);if(!s||s.voided)return;try{await query('bs_sales','update',{voided:true},id);for(let i of items.filter(x=>x.sale_id===id)){let p=products.find(x=>x.id===i.product_id);if(p)await query('bs_products','update',{stock:p.stock+i.quantity},p.id)}el('dialog').close();await refresh()}catch(err){msg('Storno nicht vollständig. Bitte prüfen: '+err.message)}}
function taskView(){return `<h2>Aufgaben</h2><div class="card"><form onsubmit="saveTask(event)"><label>Aufgabe</label><input name="title" required placeholder="z. B. Schmuck nachbestellen"><label>Fällig am</label><input type="date" name="due_date"><p><button class="primary">Speichern</button></p></form></div>${tasks.map(t=>`<div class="card line"><label><input style="width:auto" type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}',this.checked)"> ${e(t.title)} · ${dt(t.due_date)}</label></div>`).join('')}`}
async function saveTask(ev){ev.preventDefault();let f=new FormData(ev.target);try{await query('bs_tasks','insert',{user_id:user.id,title:f.get('title'),due_date:f.get('due_date')||null});await refresh()}catch(err){msg(err.message)}}async function toggleTask(id,done){try{await query('bs_tasks','update',{done},id);await refresh()}catch(err){msg(err.message)}}

async function importHistory(){
if(!user)return msg('Bitte anmelden.');
if(!confirm('Bekannte Produkte und 4 Markttermine aus deinen bisherigen Angaben einmalig übernehmen? Vorhandene Artikel und Märkte bleiben erhalten. Bestellte Mengen werden als Bestand erfasst; nur als eingetroffen markierte Artikel erscheinen in der Kasse.'))return;
let button=document.getElementById('importHistory');if(button)button.disabled=true;
try{
const existing=new Set(products.map(p=>p.name.toLowerCase()));
const newProducts=initialProducts.filter(p=>!existing.has(p[0].toLowerCase())).map(p=>({
user_id:user.id,name:p[0],category:p[1],variant:p[2],list_price:p[3],purchase_price:p[4],stock:p[5],min_stock:p[6],notes:p[7]
}));
const existingMarkets=new Set(markets.map(m=>m.market_date));
const newMarkets=initialMarkets.filter(m=>!existingMarkets.has(m.market_date)).map(m=>({...m,user_id:user.id}));
if(newProducts.length)await query('bs_products','insert',newProducts);
if(newMarkets.length)await query('bs_markets','insert',newMarkets);
await refresh();
msg('Übernommen: '+newProducts.length+' Artikel/Varianten und '+newMarkets.length+' Markttermine. Markiere im Warenlager die eingetroffenen Artikel, bevor du sie verkaufst.');
}catch(err){msg('Übernahme nicht vollständig: '+err.message);await refresh()}
finally{let b=document.getElementById('importHistory');if(b)b.disabled=false}
}

async function logout(){await sb.auth.signOut();user=null;products=[];markets=[];sales=[];items=[];tasks=[];cart=[];el('private').classList.add('hide');el('login').classList.remove('hide');el('logout').classList.add('hide')}
async function signedIn(u){user=u;el('private').classList.remove('hide');el('login').classList.add('hide');el('logout').classList.remove('hide');await refresh()}
el('loginform').addEventListener('submit',async ev=>{ev.preventDefault();el('loginmsg').textContent='Anmeldung läuft …';try{if(!sb)throw Error('Bibliothek konnte nicht geladen werden. Internetverbindung prüfen.');let {data,error}=await sb.auth.signInWithPassword({email:el('email').value,password:el('password').value});if(error)throw error;el('password').value='';el('loginmsg').textContent='';await signedIn(data.user)}catch(err){el('loginmsg').textContent='Anmeldung fehlgeschlagen: '+err.message}});
(async()=>{if(!sb){el('loginmsg').textContent='Internetverbindung erforderlich: Supabase-Bibliothek nicht geladen.';return}let {data}=await sb.auth.getUser();if(data.user)await signedIn(data.user)})();
